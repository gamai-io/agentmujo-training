name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Wikipedia sources are pinned
        run: python3 scripts/pin_wikipedia_sources.py --check
      - name: Dataset manifests match their files
        run: python3 tools/refresh_manifests.py --check
      - name: No personal data or credentials
        run: python3 tools/pii_scan.py
      - name: Release integrity (RELEASE.json sha256)
        run: python -m agentmujo_training.cli.main dataset verify --version 0.4.0
      - name: Tool registry conformance
        run: python -m agentmujo_training.cli.main dataset conformance
      - name: Tools registry check
        run: python -m agentmujo_training.cli.main tools validate
      - name: Dataset validation
        run: |
          python -m agentmujo_training.cli.main dataset validate --input datasets/canonical/function_calling_v0.1.jsonl
          python -m agentmujo_training.cli.main dataset validate --input datasets/canonical/agentic_terminal_v0.1.jsonl
